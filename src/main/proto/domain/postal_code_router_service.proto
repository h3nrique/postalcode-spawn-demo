syntax = "proto3";

package com.github.h3nrique.postalcode.proto;

import "domain/postal_code_state.proto";
import "domain/create_request.proto";
import "google/api/annotations.proto";

option java_package = "com.github.h3nrique.postalcode.proto";
option java_outer_classname = "PostalCodeRouterProto";

service PostalCodeRouter {
  rpc Create(CreateRequest) returns (PostalCodeState) {
    option (google.api.http) = {
      get: "/v1/postalcode/{postal_code}"
      body: "*"
    };
  }
}
